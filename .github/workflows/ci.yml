name: Next.js CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Lint, Build and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build standalone application
        run: npm run build

      - name: Prepare Standalone Package
        run: |
          # Copy static and public assets into standalone folder
          cp -r public .next/standalone/public
          cp -r .next/static .next/standalone/.next/static
          cd .next/standalone
          zip -r ../../deploy.zip .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifact
          path: deploy.zip
          retention-days: 1

  deploy:
    name: Deploy to AWS EC2
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: deploy-artifact

      - name: Copy deploy.zip to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy.zip"
          target: "/home/${{ secrets.EC2_USER }}/"

      - name: Deploy and Restart on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Ensure target directory exists and has proper permissions
            sudo mkdir -p /var/www/devops-app
            sudo chown -R $USER:$USER /var/www/devops-app

            # Extract standalone build package
            unzip -o ~/deploy.zip -d /var/www/devops-app
            rm -f ~/deploy.zip

            # Start or reload application with PM2
            cd /var/www/devops-app
            pm2 describe devops-app > /dev/null 2>&1 && pm2 reload devops-app || PORT=3000 pm2 start server.js --name devops-app
            pm2 save
